<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111522"><title>家庭日常：城市任務｜The Home Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#f7f5f8;--muted:#b9bbca;--pink:#ff729b;--cyan:#77d9e7;--gold:#ffd36d;--panel:#171b2b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111522;color:var(--ink);font-family:"DM Sans","Noto Sans TC",sans-serif;touch-action:none}button{font:inherit;touch-action:none}#game{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;background:#22283b}
#world{display:block;width:100%;height:100%;background:#242a3e}
.top-ui{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.mission{pointer-events:auto;width:min(66%,430px);padding:14px 16px 13px;background:rgba(22,25,43,.94);border:1px solid rgba(255,255,255,.14);border-radius:19px;box-shadow:0 12px 34px #080b1690;backdrop-filter:blur(14px)}
.mission-kicker{font-size:11px;color:#aeb5cb;letter-spacing:.12em;font-weight:800}.mission h1{font-size:clamp(16px,3vw,23px);line-height:1.35;margin:5px 0 4px}.mission p{font-size:12px;color:var(--pink);margin:0;font-weight:700}.mission-progress{height:4px;background:#ffffff18;border-radius:9px;margin-top:11px;overflow:hidden}.mission-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .3s}
.top-actions{display:flex;gap:8px;pointer-events:auto}.pill{border:1px solid #ffffff35;background:#171b2be8;color:#fff;border-radius:99px;padding:10px 14px;font-size:11px;font-weight:800;backdrop-filter:blur(10px)}.pill:active,.action:active{transform:scale(.96)}
.character-switch{position:absolute;z-index:5;top:max(120px,calc(env(safe-area-inset-top) + 108px));right:14px;display:flex;gap:7px}.char-btn{display:flex;align-items:center;gap:7px;border:1px solid #ffffff30;background:#171b2bdc;color:#fff;border-radius:14px;padding:8px 11px;font-size:11px;font-weight:800;backdrop-filter:blur(10px)}.char-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan)}.char-btn.jenny .dot{background:var(--pink)}.char-btn.active{border-color:var(--gold);box-shadow:0 0 0 2px #ffd36d30}
.hint{position:absolute;z-index:4;left:50%;top:42%;transform:translate(-50%,-50%);width:max-content;max-width:82%;padding:12px 18px;border-radius:14px;background:#111522df;border:1px solid #ffffff20;text-align:center;font-size:clamp(13px,2.8vw,18px);font-weight:700;line-height:1.6;box-shadow:0 8px 30px #0005;pointer-events:none;transition:opacity .25s}.hint.hide{opacity:0}
.bottom-ui{position:absolute;z-index:5;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px;pointer-events:none}
.joystick{width:142px;height:142px;border-radius:50%;border:4px solid #ffffff38;background:#aab2c322;box-shadow:0 0 0 9px #080b162d,inset 0 0 24px #fff1;position:relative;pointer-events:auto;touch-action:none;backdrop-filter:blur(4px)}
.stick{position:absolute;left:50%;top:50%;width:61px;height:61px;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #ffffffb8;background:linear-gradient(145deg,#d9dce8a8,#69728caa);box-shadow:0 4px 14px #0006;pointer-events:none}
.joy-arrow{position:absolute;color:#ffffff9c;font-size:17px;font-weight:900;pointer-events:none}.up{top:9px;left:calc(50% - 6px)}.down{bottom:8px;left:calc(50% - 6px)}.left{left:10px;top:calc(50% - 11px)}.right{right:10px;top:calc(50% - 11px)}
.action-wrap{display:flex;align-items:flex-end;gap:12px;pointer-events:auto}.action{width:82px;height:82px;border-radius:50%;border:2px solid #ffffff9c;background:linear-gradient(145deg,#ff91ad,#d84979);color:white;font-size:13px;font-weight:900;box-shadow:0 7px 24px #d8497950;touch-action:none}.action:disabled{filter:grayscale(1);opacity:.55}.mini-action{width:54px;height:54px;border-radius:50%;border:1px solid #ffffff75;background:#171b2bdc;color:white;font-size:11px;font-weight:800}
.toast{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;background:#171b2bf5;border:1px solid #ffffff28;border-radius:18px;padding:20px 23px;text-align:center;width:min(86%,380px);box-shadow:0 20px 60px #0009;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast .emoji{font-size:34px}.toast h2{font-size:20px;margin:7px 0}.toast p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 15px}.toast button{border:0;border-radius:11px;background:linear-gradient(100deg,#ff91ad,#ffd36d);color:#231722;padding:11px 18px;font-weight:900}
.status{position:absolute;z-index:4;left:14px;top:max(125px,calc(env(safe-area-inset-top) + 112px));background:#171b2bc9;border:1px solid #ffffff20;border-radius:12px;padding:8px 11px;font-size:10px;color:#cbd1e0;backdrop-filter:blur(10px)}.status b{color:var(--gold)}
@media(min-width:850px){.mission{width:400px}.bottom-ui{padding:0 7vw}.joystick{width:154px;height:154px}.stick{width:66px;height:66px}.action{width:92px;height:92px}}
@media(max-width:520px){.top-ui{left:10px;right:10px}.mission{width:70%;padding:11px 12px;border-radius:16px}.mission-kicker{font-size:9px}.mission h1{font-size:16px}.mission p{font-size:10px}.pill{padding:9px 10px;font-size:10px}.character-switch{top:max(118px,calc(env(safe-area-inset-top) + 108px));right:10px}.char-btn{padding:7px 9px;font-size:10px}.status{top:max(174px,calc(env(safe-area-inset-top) + 164px));left:10px}.joystick{width:126px;height:126px}.stick{width:56px;height:56px}.bottom-ui{padding:0 18px 8px}.action{width:73px;height:73px}.mini-action{width:48px;height:48px}}
</style>
</head>
<body>
<div id="game">
<canvas id="world" aria-label="可操作的家庭城市冒險遊戲"></canvas>
<div class="top-ui">
 <section class="mission"><div class="mission-kicker" id="missionKicker">任務 1 / 4 · 星期五晚上</div><h1 id="missionTitle">去便利商店買宵夜</h1><p id="missionSub">跟著黃色箭頭走</p><div class="mission-progress"><i id="progressBar"></i></div></section>
 <div class="top-actions"><button class="pill" id="pauseBtn">Ⅱ 暫停</button></div>
</div>
<div class="character-switch"><button class="char-btn active" id="bobBtn"><i class="dot"></i> Bob</button><button class="char-btn jenny" id="jennyBtn"><i class="dot"></i> Jenny</button></div>
<div class="status" id="status">目前操控：<b>Bob</b>　·　靠近目的地按互動</div>
<div class="hint" id="hint">穿上喜歡的衣服，出門買宵夜吧！<br><span style="color:#ff91ad">滑動左下方搖桿開始移動</span></div>
<div class="bottom-ui">
 <div class="joystick" id="joystick"><span class="joy-arrow up">▲</span><span class="joy-arrow down">▼</span><span class="joy-arrow left">◀</span><span class="joy-arrow right">▶</span><div class="stick" id="stick"></div></div>
 <div class="action-wrap"><button class="mini-action" id="switchBtn">切換<br>角色</button><button class="action" id="interactBtn" disabled>互動</button></div>
</div>
<div class="toast" id="toast"><div class="emoji" id="toastEmoji">✨</div><h2 id="toastTitle">任務完成</h2><p id="toastText"></p><button id="toastBtn">繼續 →</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=800,H=1000;
let scale=1,paused=false,finished=false,toastOpen=false,last=0,move={x:0,y:0},keys={};
const colors={bob:'#72d6e3',jenny:'#f08cba'};
const characters={bob:{name:'Bob',x:125,y:890,color:colors.bob,load:0},jenny:{name:'Jenny',x:165,y:890,color:colors.jenny,load:0}};
let active='bob',mission=0,steps=0;
const missions=[
 {title:'去便利商店買宵夜',sub:'跟著螢光黃箭頭走',place:'便利商店',x:660,y:285,icon:'🏪',task:'買好孩子和兩人的宵夜',detail:'你走進便利商店，買了牛奶、麵包和孩子喜歡的小點心。記得：採買也包含事前記住家裡需要什麼。',who:'採買與規劃'},
 {title:'到托育中心接孩子',sub:'孩子正在等你回家',place:'托育中心',x:145,y:535,icon:'🧸',task:'接孩子並確認明天用品',detail:'老師交代了孩子今天的情況，也提醒明天要帶替換衣物。照顧不只是接送，也包括記住孩子的需要。',who:'接送與照顧'},
 {title:'到市場買晚餐食材',sub:'準備一家人的晚餐',place:'街市',x:660,y:630,icon:'🥬',task:'買齊晚餐食材',detail:'你買好了晚餐食材。這個家需要有人動手，也需要有人記得冰箱還缺什麼。',who:'家務與心智勞動'},
 {title:'回家一起準備晚餐',sub:'今天的最後一個任務',place:'家',x:145,y:890,icon:'🏠',task:'與家人一起完成晚餐',detail:'孩子回到家了。今天的任務完成，但家庭分工不是一天就能解決。Bob 和 Jenny 開始討論：以後如何讓照顧和家務成為兩個人共同的責任？',who:'共同照顧'}
];
const blocks=[
 {x:0,y:0,w:800,h:115,c:'#20263a'}, {x:0,y:115,w:800,h:90,c:'#283e38'},
 {x:0,y:205,w:800,h:90,c:'#444b63'}, {x:0,y:295,w:800,h:250,c:'#20263a'},
 {x:0,y:545,w:800,h:85,c:'#454c64'}, {x:0,y:630,w:800,h:240,c:'#20263a'},
 {x:0,y:870,w:800,h:130,c:'#454c64'}
];
const buildings=[
 {x:22,y:120,w:250,h:145,name:'公寓',color:'#353b53',win:true},
 {x:520,y:120,w:250,h:145,name:'便利商店',color:'#3d465c',win:true,sign:'便利商店'},
 {x:22,y:650,w:250,h:200,name:'家',color:'#41465e',win:true,sign:'HOME'},
 {x:520,y:650,w:250,h:200,name:'街市',color:'#3b435a',win:true,sign:'街市'},
 {x:22,y:315,w:250,h:205,name:'托育中心',color:'#3c465d',win:true,sign:'托育中心'},
 {x:520,y:315,w:250,h:205,name:'公園',color:'#29463e',win:false,sign:'PARK'}
];
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);scale=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(scale,0,0,scale,(canvas.width-W*scale)/2,(canvas.height-H*scale)/2);}
window.addEventListener('resize',resize);resize();
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function drawBuilding(b){
 roundRect(b.x,b.y,b.w,b.h,8,b.color,'#ffffff13');
 if(b.win){for(let y=b.y+25;y<b.y+b.h-15;y+=48)for(let x=b.x+20;x<b.x+b.w-15;x+=48){ctx.fillStyle=((x+y)%3<1)?'#f3c86b':'#262c42';ctx.fillRect(x,y,18,20);}}
 if(b.sign){roundRect(b.x+22,b.y+10, b.w-44,28,7,'#171b2b','#ffffff22');ctx.fillStyle='#f7e9c9';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(b.sign,b.x+b.w/2,b.y+29);}
}
function drawWorld(){
 ctx.clearRect(0,0,W,H);
 // base blocks and night-time neighbourhood
 ctx.fillStyle='#20263a';ctx.fillRect(0,0,W,H);
 // pavements
 ctx.fillStyle='#454b63';ctx.fillRect(0,285,W,28);ctx.fillRect(0,535,W,28);ctx.fillRect(0,865,W,28);
 ctx.fillRect(0,0,22,H);ctx.fillRect(778,0,22,H);
 // roads
 ctx.fillStyle='#292e45';ctx.fillRect(0,313,W,222);ctx.fillRect(0,563,W,302);
 ctx.strokeStyle='#8e805c';ctx.lineWidth=3;ctx.setLineDash([48,55]);ctx.beginPath();ctx.moveTo(0,423);ctx.lineTo(W,423);ctx.stroke();ctx.setLineDash([]);
 // street lights
 for(const x of [75,400,725]){ctx.fillStyle='#eecb79';ctx.globalAlpha=.65;ctx.fillRect(x,335,3,28);ctx.fillRect(x,755,3,28);ctx.globalAlpha=1;}
 // green park pocket
 ctx.fillStyle='#29463e';ctx.fillRect(520,205,250,80);
 for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#335b4a':'#203c35';ctx.beginPath();ctx.arc(555+i*38,245+(i%2)*9,18,0,Math.PI*2);ctx.fill();}
 buildings.forEach(drawBuilding);
 // sidewalk tile seams
 ctx.strokeStyle='#ffffff0b';ctx.lineWidth=2;
 for(let x=0;x<800;x+=78){ctx.beginPath();ctx.moveTo(x,285);ctx.lineTo(x,313);ctx.moveTo(x,535);ctx.lineTo(x,563);ctx.moveTo(x,865);ctx.lineTo(x,893);ctx.stroke();}
 // objective beacon and dotted guide
 if(!finished){const m=missions[mission],p=characters[active];ctx.save();ctx.strokeStyle='#ffd36d';ctx.lineWidth=3;ctx.setLineDash([8,11]);ctx.globalAlpha=.62;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(m.x,m.y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
 ctx.shadowColor='#ffd36d';ctx.shadowBlur=25;ctx.fillStyle='#ffd36d';ctx.beginPath();ctx.arc(m.x,m.y-28,10+Math.sin(performance.now()/190)*3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff1b9';ctx.beginPath();ctx.moveTo(m.x,m.y-15);ctx.lineTo(m.x-9,m.y-32);ctx.lineTo(m.x+9,m.y-32);ctx.closePath();ctx.fill();ctx.restore();}
 // characters
 Object.entries(characters).forEach(([id,p])=>drawPerson(p,id===active));
 // interaction distance
 const p=characters[active],m=missions[mission],near=!finished&&Math.hypot(p.x-m.x,p.y-m.y)<65;
 $('interactBtn').disabled=!near||paused||toastOpen||finished;
}
function drawPerson(p,selected){
 ctx.save();ctx.translate(p.x,p.y);
 if(selected){ctx.fillStyle='#ffd36d35';ctx.beginPath();ctx.ellipse(0,9,28,14,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd36d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-8,23,0,Math.PI*2);ctx.stroke();}
 ctx.fillStyle='#11152299';ctx.beginPath();ctx.ellipse(0,13,17,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(-13,-9,26,26,10);ctx.fill();
 ctx.fillStyle='#f1c9a6';ctx.beginPath();ctx.arc(0,-18,12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#3b2b32';ctx.beginPath();ctx.arc(0,-22,12,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(p.name,0,34);
 ctx.restore();
}
function isBlocked(x,y){if(x<28||x>772||y<28||y>972)return true;return buildings.some(b=>x>b.x-15&&x<b.x+b.w+15&&y>b.y-15&&y<b.y+b.h+15);}
function tick(t){const dt=Math.min((t-last)/16.67||1,2);last=t;if(!paused&&!toastOpen&&!finished){let dx=move.x,dy=move.y;if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dy-=1;if(keys.ArrowDown||keys.s)dy+=1;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}const p=characters[active],speed=3.05*dt;const nx=p.x+dx*speed,ny=p.y+dy*speed;if(!isBlocked(nx,p.y))p.x=nx;if(!isBlocked(p.x,ny))p.y=ny;}
 drawWorld();requestAnimationFrame(tick);}
requestAnimationFrame(tick);
function updateHUD(){const m=missions[mission];$('missionKicker').textContent='任務 '+(mission+1)+' / 4 · 星期五晚上';$('missionTitle').textContent=m.title;$('missionSub').textContent=m.sub;$('progressBar').style.width=(mission/4*100)+'%';$('status').innerHTML='目前操控：<b>'+characters[active].name+'</b>　·　'+m.place+'在前方';}
function switchCharacter(){if(paused||toastOpen||finished)return;active=active==='bob'?'jenny':'bob';$('bobBtn').classList.toggle('active',active==='bob');$('jennyBtn').classList.toggle('active',active==='jenny');updateHUD();}
function showToast(title,text,emoji,button){toastOpen=true;$('toastTitle').textContent=title;$('toastText').textContent=text;$('toastEmoji').textContent=emoji;$('toastBtn').textContent=button||'繼續 →';$('toast').classList.add('show');}
function interact(){if($('interactBtn').disabled)return;const m=missions[mission],p=characters[active];p.load++;steps++;mission++;$('progressBar').style.width=(mission/4*100)+'%';if(mission<4){updateHUD();showToast('任務完成！',m.detail,m.icon,'下一個任務 →');}else{finished=true;$('missionKicker').textContent='全部任務完成';$('missionTitle').textContent='回到家，一起吃晚餐';$('missionSub').textContent='今天的城市任務完成了';$('progressBar').style.width='100%';showToast('今晚，這個家一起完成了任務','Bob 承擔 '+characters.bob.load+' 項；Jenny 承擔 '+characters.jenny.load+' 項。照顧與家務不只是「幫忙」，而是兩個人共同的責任。','🏡','重新開始');}}
function continueToast(){ $('toast').classList.remove('show');toastOpen=false;if(finished){mission=0;steps=0;finished=false;characters.bob.x=125;characters.bob.y=890;characters.jenny.x=165;characters.jenny.y=890;characters.bob.load=0;characters.jenny.load=0;active='bob';$('bobBtn').classList.add('active');$('jennyBtn').classList.remove('active');$('hint').classList.remove('hide');}else if(mission===1){$('hint').classList.add('hide');}updateHUD();}
$('toastBtn').addEventListener('click',continueToast);$('interactBtn').addEventListener('click',interact);
$('bobBtn').addEventListener('click',()=>{if(active!=='bob')switchCharacter();});$('jennyBtn').addEventListener('click',()=>{if(active!=='jenny')switchCharacter();});$('switchBtn').addEventListener('click',switchCharacter);
$('pauseBtn').addEventListener('click',()=>{if(toastOpen)return;paused=!paused;$('pauseBtn').textContent=paused?'▶ 繼續':'Ⅱ 暫停';if(paused)showToast('遊戲暫停','休息一下。準備好後按下繼續。','Ⅱ','繼續遊戲');else{$('toast').classList.remove('show');toastOpen=false;}});
const joy=$('joystick'),stick=$('stick');let pointer=null;
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let x=e.clientX-cx,y=e.clientY-cy,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max;}move={x:x/max,y:y/max};stick.style.left='calc(50% + '+x+'px)';stick.style.top='calc(50% + '+y+'px)';}
joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);joyMove(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)joyMove(e);});function joyEnd(e){if(e.pointerId!==pointer)return;pointer=null;move={x:0,y:0};stick.style.left='50%';stick.style.top='50%';}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '||e.key==='Enter')interact();if(e.key==='Tab'){e.preventDefault();switchCharacter();}});window.addEventListener('keyup',e=>keys[e.key]=false);
updateHUD();
})();
</script>
</body></html>
