</style></head><body><canvas id="world" aria-label="2D 城市探索遊戲場景"></canvas>
<div class="hud"><div class="mission-card"><div class="mission-kicker" id="missionNumber">任務 1 / 4</div><div class="mission-title" id="missionTitle">去便利商店買宵夜</div><div class="mission-hint" id="missionHint">跟著黃色箭頭前進</div><div class="mission-detail" id="missionDetail"></div><div class="progress"><i id="progressFill"></i></div></div><div class="hud-right"><div class="characters"><button class="character-btn active" id="bobSelect" data-person="bob" aria-pressed="true">Bob</button><button class="character-btn" id="jennySelect" data-person="jenny" aria-pressed="false">Jenny</button></div><button class="hud-button" id="pauseButton">暫停</button></div></div>

<div class="overlay" id="finishOverlay"><div class="modal"><div class="eyebrow">DAY COMPLETE · 4 / 4</div><h2>今晚，兩個人都辛苦了。</h2><p id="finishText"></p><button class="primary" id="againButton">再玩一次</button></div></div><button id="restartButton" style="position:fixed;right:12px;bottom:12px;width:2px;height:2px;opacity:0">restart</button>
<script>const $=id=>document.getElementById(id);const canvas=$('world'),ctx=canvas.getContext('2d');
const W=1800,H=1400,players={bob:{x:480,y:380,name:'Bob',skin:'#e9bd99',hair:'#342a34',shirt:'#51bdca'},jenny:{x:555,y:380,name:'Jenny',skin:'#f1c8a8',hair:'#362b3b',shirt:'#d68ab8'}};
const tasks=[
{actor:'bob',title:'去便利商店買宵夜',hint:'跟著黃色箭頭前進',detail:'孩子睡了，家裡想吃點宵夜。控制 Bob 走到便利商店門口，按下互動。',target:{x:1420,y:390},place:'便利商店',done:'Bob 買好了宵夜，也記得 Jenny 喜歡的口味。'},
{actor:'jenny',title:'到公園拿回孩子的外套',hint:'切換至 Jenny，前往公園',detail:'孩子把外套留在公園。換 Jenny 出發，到長椅附近找回外套。',target:{x:1320,y:800},place:'城市公園',done:'Jenny 找回外套，也終於能在公園喘一口氣。'},
{actor:'bob',title:'去街市買明天的食材',hint:'切換至 Bob，前往街市',detail:'明天的早餐和孩子的午餐都要準備。控制 Bob 到街市買齊食材。',target:{x:500,y:1050},place:'街市',done:'Bob 買齊食材，並先把購物袋送回家。'},
{actor:'jenny',title:'回家一起準備宵夜',hint:'切換至 Jenny，回到家門口',detail:'最後一段路。控制 Jenny 回家，兩人一起整理食物，結束忙碌的一天。',target:{x:480,y:380},place:'家',done:'Bob 和 Jenny 終於一起坐下來。家務不會自動消失，但可以由兩個人共同承擔。'}
];
const buildings=[{x:110,y:100,w:310,h:235,name:'家',sub:'HOME',color:'#465b73'},{x:1240,y:100,w:360,h:260,name:'便利商店',sub:'24H MART',color:'#416c68'},{x:100,y:900,w:360,h:285,name:'街市',sub:'MARKET',color:'#765c50'},{x:510,y:90,w:205,h:220,name:'社區中心',sub:'COMMUNITY',color:'#625c7b'}];
const trees=[[1090,900],[1200,940],[1510,890],[1640,1030],[1480,1190],[1170,1190],[1040,1070],[1600,870],[1380,1260],[1250,1120]];
let active='bob',mission=0,paused=false,finished=false,toastTimer=0,keys=new Set(),joy={x:0,y:0},cw=innerWidth,ch=innerHeight,dpr=1,cam={x:0,y:0};
const obstacles=buildings.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h}));
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function current(){return players[active]}function task(){return tasks[mission]}
function resize(){dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;canvas.width=cw*dpr;canvas.height=ch*dpr;canvas.style.width=cw+'px';canvas.style.height=ch+'px'}
addEventListener('resize',resize);resize();
function blocked(x,y){for(const r of obstacles){const a=clamp(x,r.x,r.x+r.w),b=clamp(y,r.y,r.y+r.h);if(Math.hypot(x-a,y-b)<19)return true}return false}
function near(){return !finished&&task().actor===active&&dist(current(),task().target)<94}
function hud(){const t=task();$('missionNumber').textContent=finished?'完成':'任務 '+(mission+1)+' / 4';$('missionTitle').textContent=finished?'今天辛苦了！':t.title;$('missionHint').textContent=finished?'你和家人一起完成了今天的行程。':t.hint;$('missionDetail').textContent=finished?'':t.detail;$('progressFill').style.width=(mission/4*100)+'%';$('bobSelect').classList.toggle('active',active==='bob');$('jennySelect').classList.toggle('active',active==='jenny');$('bobSelect').setAttribute('aria-pressed',active==='bob');$('jennySelect').setAttribute('aria-pressed',active==='jenny');$('actorLabel').textContent=finished?'行程完成':'目前操控：'+(active==='bob'?'Bob':'Jenny');$('actorTip').textContent=finished?'':t.actor===active?'角色正確，可以出發！':'這個任務需要 '+(t.actor==='bob'?'Bob':'Jenny')+'，請切換角色。';$('actionButton').disabled=!near();$('actionButton').textContent=finished?'已完成':near()?'✦　互動':'接近目標後互動';$('pauseButton').textContent=paused?'繼續':'暫停'}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');toastTimer=2.8}
function switchTo(w){if(finished)return;active=w;hud();notify('現在由 '+(w==='bob'?'Bob':'Jenny')+' 操控')}
function interact(){if(paused||finished)return;const t=task();if(t.actor!==active){notify('這項任務需要 '+(t.actor==='bob'?'Bob':'Jenny')+'，先切換角色。');return}if(!near()){notify('還未到達'+t.place+'，跟著黃色箭頭走！');return}notify(t.done);mission++;if(mission===3){players.bob.x=480;players.bob.y=380}if(mission>=tasks.length){finished=true;$('finishText').textContent='你完成了今晚的四項任務。Bob 和 Jenny 都有參與家庭生活，也開始把照顧、採買和休息當成共同責任。';$('finishOverlay').classList.add('visible')}hud()}
function move(dt){if(paused||finished)return;let x=joy.x,y=joy.y;if(keys.has('ArrowLeft')||keys.has('a'))x--;if(keys.has('ArrowRight')||keys.has('d'))x++;if(keys.has('ArrowUp')||keys.has('w'))y--;if(keys.has('ArrowDown')||keys.has('s'))y++;const n=Math.hypot(x,y);if(n>1){x/=n;y/=n}const p=current(),speed=225,nx=clamp(p.x+x*speed*dt,22,W-22),ny=clamp(p.y+y*speed*dt,22,H-22);if(!blocked(nx,p.y))p.x=nx;if(!blocked(p.x,ny))p.y=ny}
function ground(){ctx.fillStyle='#29382f';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=72)for(let x=0;x<W;x+=72){ctx.fillStyle=((x+y)/72)%2?'#2d3e34':'#293a32';ctx.fillRect(x+3,y+3,66,66)}ctx.fillStyle='#303246';ctx.fillRect(0,480,W,170);ctx.fillRect(790,0,180,H);ctx.fillStyle='#56576b';ctx.fillRect(0,420,W,60);ctx.fillRect(0,650,W,62);ctx.fillRect(730,0,60,H);ctx.fillRect(970,0,60,H);ctx.strokeStyle='#414458';ctx.lineWidth=3;for(let x=0;x<W;x+=86){ctx.beginPath();ctx.moveTo(x,422);ctx.lineTo(x,478);ctx.moveTo(x,652);ctx.lineTo(x,710);ctx.stroke()}for(let y=0;y<H;y+=82){ctx.beginPath();ctx.moveTo(732,y);ctx.lineTo(788,y);ctx.moveTo(972,y);ctx.lineTo(1028,y);ctx.stroke()}ctx.strokeStyle='#a99b70';ctx.lineWidth=4;ctx.setLineDash([58,88]);ctx.beginPath();ctx.moveTo(0,565);ctx.lineTo(W,565);ctx.moveTo(880,0);ctx.lineTo(880,H);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#d3c6a5';for(let i=0;i<6;i++){ctx.fillRect(745+i*27,483,15,42);ctx.fillRect(745+i*27,605,15,42);ctx.fillRect(800,430+i*9,42,5);ctx.fillRect(920,430+i*9,42,5)}}
function building(b){ctx.fillStyle='#11152266';ctx.fillRect(b.x+10,b.y+12,b.w,b.h);ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#ffffff12';ctx.fillRect(b.x+8,b.y+8,b.w-16,12);const cols=Math.max(2,Math.floor(b.w/72));for(let r=0;r<2;r++)for(let c=0;c<cols;c++){const x=b.x+24+c*(b.w-45)/cols,y=b.y+48+r*75;ctx.fillStyle=(c+r)%3===0?'#e8c36c':'#293047';ctx.fillRect(x,y,25,34);ctx.fillStyle='#ffffff16';ctx.fillRect(x,y,25,4)}ctx.fillStyle='#22283a';ctx.fillRect(b.x+b.w/2-28,b.y+b.h-62,56,62);ctx.textAlign='center';ctx.font='bold 24px sans-serif';ctx.fillStyle='#f4f0e8';ctx.fillText(b.name,b.x+b.w/2,b.y+b.h+33);ctx.font='10px sans-serif';ctx.fillStyle='#d3d0c4';ctx.fillText(b.sub,b.x+b.w/2,b.y+b.h+50)}
function tree(x,y){ctx.fillStyle='#16251f88';ctx.beginPath();ctx.ellipse(x+7,y+17,35,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#76533f';ctx.fillRect(x-7,y-7,14,40);ctx.fillStyle='#477a55';ctx.beginPath();ctx.arc(x,y-12,32,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5f9564';ctx.beginPath();ctx.arc(x-10,y-24,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8eaa68';ctx.beginPath();ctx.arc(x+10,y-18,11,0,Math.PI*2);ctx.fill()}
function park(){ctx.fillStyle='#355341';ctx.fillRect(1035,835,700,520);ctx.fillStyle='#476c50';ctx.fillRect(1070,875,625,430);ctx.strokeStyle='#c2b890';ctx.lineWidth=36;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(1060,800);ctx.quadraticCurveTo(1320,860,1420,1000);ctx.quadraticCurveTo(1530,1110,1670,1190);ctx.stroke();ctx.strokeStyle='#e1d7b5';ctx.lineWidth=3;ctx.stroke();trees.forEach(p=>tree(p[0],p[1]));ctx.fillStyle='#6e4c3a';ctx.fillRect(1265,785,90,15);ctx.fillRect(1275,800,8,22);ctx.fillRect(1338,800,8,22);ctx.fillStyle='#f6d58b';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('CITY PARK',1390,1320)}
function props(){for(const [x,y] of [[620,440],[1080,440],[620,690],[1080,690],[700,280],[1005,280],[700,900],[1005,900]]){ctx.fillStyle='#1a1d2b';ctx.fillRect(x-4,y-35,8,44);ctx.fillStyle='#f4d17d';ctx.beginPath();ctx.arc(x,y-39,9,0,Math.PI*2);ctx.fill()}for(const [x,y] of [[470,450],[1160,450],[680,750],[1040,750],[600,1180],[950,1200]]){ctx.fillStyle='#a66e57';ctx.fillRect(x-9,y-10,18,17);ctx.fillStyle='#6f9b65';ctx.beginPath();ctx.arc(x,y-15,10,0,Math.PI*2);ctx.fill()}}
function person(p,selected){const b=Math.sin(performance.now()/125+(p.name==='Bob'?0:1))*1.5;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#10121b88';ctx.beginPath();ctx.ellipse(0,15,22,9,0,0,Math.PI*2);ctx.fill();if(selected){ctx.strokeStyle=p.name==='Bob'?'#74e8f1':'#f6a9db';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-7,28,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=p.shirt;ctx.beginPath();ctx.roundRect(-14,-4+b,28,29,12);ctx.fill();ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(0,-17+b,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(0,-21+b,12,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-12,-22+b,24,6);ctx.fillStyle='#292331';ctx.beginPath();ctx.arc(-4,-16+b,1.3,0,Math.PI*2);ctx.arc(4,-16+b,1.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5f1e9';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(p.name,0,43);ctx.restore()}
function arrow(p,t){const a=Math.atan2(t.y-p.y,t.x-p.x)+Math.PI/2,s=1+Math.sin(performance.now()/180)*.12;ctx.save();ctx.translate(p.x,p.y-52);ctx.rotate(a);ctx.scale(s,s);ctx.shadowColor='#ffd65e';ctx.shadowBlur=22;ctx.fillStyle='#ffd65e';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(15,-4);ctx.lineTo(5,-7);ctx.lineTo(5,12);ctx.lineTo(-5,12);ctx.lineTo(-5,-7);ctx.lineTo(-15,-4);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){ground();park();buildings.forEach(building);props();if(!finished){const t=task();ctx.save();ctx.translate(t.target.x,t.target.y);const s=1+Math.sin(performance.now()/220)*.13;ctx.scale(s,s);ctx.strokeStyle='#ffd65e';ctx.lineWidth=4;ctx.setLineDash([8,8]);ctx.beginPath();ctx.arc(0,0,33,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffd65e';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('目的地',0,-36);ctx.restore()}person({x:1370,y:960,name:'小朋友',skin:'#edc39e',hair:'#302b32',shirt:'#e6b45f'},false);person(players.bob,active==='bob');person(players.jenny,active==='jenny');if(!finished&&task().actor===active)arrow(current(),task().target)}
function loop(now){if(!loop.last)loop.last=now;const dt=Math.min((now-loop.last)/1000,.04);loop.last=now;if(!paused&&!finished){move(dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('show')}}const p=current();cam.x=clamp(p.x-cw/2,0,W-cw);cam.y=clamp(p.y-ch/2,0,H-ch);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);ctx.save();ctx.translate(-cam.x,-cam.y);draw();ctx.restore();hud();requestAnimationFrame(loop)}
function pause(){if(finished)return;paused=!paused;$('pauseOverlay').classList.toggle('visible',paused);hud()}
$('bobSelect').addEventListener('click',()=>switchTo('bob'));$('jennySelect').addEventListener('click',()=>switchTo('jenny'));$('actionButton').addEventListener('click',interact);$('pauseButton').addEventListener('click',pause);$('resumeButton').addEventListener('click',pause);
$('restartButton').addEventListener('click',()=>{mission=0;active='bob';paused=false;finished=false;players.bob.x=480;players.bob.y=380;players.jenny.x=555;players.jenny.y=380;$('finishOverlay').classList.remove('visible');$('pauseOverlay').classList.remove('visible');hud();notify('重新開始這趟家庭小冒險！')});
$('againButton').addEventListener('click',()=>$('restartButton').click());
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(k===' '||k==='e'){interact();return}if(k==='Shift'){switchTo(active==='bob'?'jenny':'bob');return}keys.add(k)});
addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
const joystick=$('joystick'),knob=$('knob');let pointer=null;
function joyMove(e){const r=joystick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.32,n=Math.hypot(dx,dy),s=n>max?max/n:1;joy.x=dx*s/max;joy.y=dy*s/max;knob.style.transform='translate('+(dx*s)+'px,'+(dy*s)+'px)'}
joystick.addEventListener('pointerdown',e=>{pointer=e.pointerId;joystick.setPointerCapture(pointer);joyMove(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)joyMove(e)});
function joyEnd(e){if(e.pointerId!==pointer)return;pointer=null;joy.x=0;joy.y=0;knob.style.transform='translate(0,0)'}
joystick.addEventListener('pointerup',joyEnd);joystick.addEventListener('pointercancel',joyEnd);
hud();requestAnimationFrame(loop);</script></body></html>
